<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Study Hub Junction</title>
    <meta name="robots" content="noindex,follow">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <style>
      body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f8fc;color:#101f42;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
      .card{max-width:520px;text-align:center;background:#fff;border:1px solid #e2e9f6;border-radius:20px;padding:36px 28px;box-shadow:0 18px 40px rgba(16,31,66,.08)}
      img{width:84px;height:84px;border-radius:18px}
      h1{font-size:1.6rem;margin:16px 0 8px}
      p{color:#5d6b87;line-height:1.6;margin:0 0 20px}
      a.btn{display:inline-block;background:#255bd7;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px}
    </style>
    <script>
      // Known Study Hub Junction routes use hash routing in the rebuilt site.
      const known = new Set(["class-9","class-10","class-11","class-12","jee-main","jee-advanced","neet","ssc","search","admin","about","contact","privacy-policy","terms","disclaimer","boards","seo-files"]);
      const pieces = location.pathname.split("/").filter(Boolean);
      if (pieces.length && known.has(pieces[0])) {
        location.replace("/#" + location.pathname + location.search.replace("?", "?"));
      }
    </script>
  </head>
  <body>
    <main class="card">
      <img src="/assets/logo.png" alt="Study Hub Junction logo" width="84" height="84">
      <h1>Page not found</h1>
      <p>Ye page nahi mila. Ho sakta hai link purana ho ya material abhi add nahi hua ho. Home se search karke apna notes / PYQ aasani se dhundh sakte ho.</p>
      <a class="btn" href="/#/">Go to Study Hub Junction home</a>
    </main>
  </body>
</html>
